{% extends 'base/base.html' %}
{% block title %}Delete Property{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:500px">
    <div class="card p-4 text-center">
        <i class="fas fa-exclamation-triangle text-danger fa-3x mb-3"></i>
        <h4 class="fw-bold">Delete Property?</h4>
        <p class="text-muted">Are you sure you want to delete <strong>{{ property.title }}</strong>? This action cannot be undone.</p>
        <form method="post" class="d-flex gap-3 justify-content-center mt-3">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
            <a href="{% url 'property_detail' property.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
