{% extends 'base/base.html' %}
{% block title %}Login - House Lease System{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:420px">
    <div class="card p-4">
        <div class="text-center mb-4">
            <i class="fas fa-sign-in-alt fa-2x text-success mb-2"></i>
            <h3 class="fw-bold">Welcome Back</h3>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                {{ form.password }}
                {% if form.non_field_errors %}
                <div class="alert alert-danger mt-2 py-2 small">{{ form.non_field_errors }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">Login</button>
        </form>
        <p class="text-center text-muted mt-3 small">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </div>
</div>
{% endblock %}
